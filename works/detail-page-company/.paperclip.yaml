schema: paperclip/v1

company:
  brandColor: "#FF6B35"
  # 에이전트가 스스로 사람을 뽑을 일이 없는 고정 파이프라인이므로 승인 게이트 불필요
  requireBoardApprovalForNewAgents: false

# 공통 메모
#   - adapter.config.model 은 일부러 비워둔다. claude CLI 로그인 계정의 기본 모델을 쓴다.
#     특정 모델로 고정하려면 임포트 후 보드 UI에서 지정한다.
#   - cwd 는 이 머신 전용 경로다. 다른 머신으로 옮기면 반드시 바꾼다.
#   - heartbeat.enabled=false 는 의도적이다. 타이머로 계속 깨우지 않고
#     "배정될 때만" 깨어나는 이벤트 구동 방식(docs/agents-runtime.md §7.2)을 쓴다.
#     임포트 시 어차피 타이머는 꺼진 채로 들어온다.

agents:
  orchestrator:
    role: ceo
    icon: compass
    capabilities: 파이프라인 총괄, 단계 진행 판단, 문제 단계 재실행 라우팅
    budgetMonthlyCents: 0
    adapter:
      type: claude_local
      config:
        cwd: /home/leehg/Documents/workspace/detail-page-workspace
        timeoutSec: 900
        graceSec: 15
        maxTurnsPerRun: 120
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 300
        wakeOnDemand: true
        maxConcurrentRuns: 1

  analyst:
    role: researcher
    icon: search
    capabilities: 참고 페이지·판매 페이지·영상 분석, 컨셉·톤앤매너 도출, 제품 정보 구조화, 이미지 분류, 사실 기반 확립
    budgetMonthlyCents: 0
    reportsTo: orchestrator
    adapter:
      type: claude_local
      config:
        cwd: /home/leehg/Documents/workspace/detail-page-workspace
        # 참고 페이지·영상을 실제로 열어본다. 차단 사이트 우회(insane-search)까지 감안해 늘렸다.
        timeoutSec: 1800
        graceSec: 15
        maxTurnsPerRun: 120
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  strategist:
    role: product
    icon: target
    capabilities: 판매 전략 수립, 후킹 장치 선정, 세로 스크롤 컷 구성 설계
    budgetMonthlyCents: 0
    reportsTo: orchestrator
    adapter:
      type: claude_local
      config:
        cwd: /home/leehg/Documents/workspace/detail-page-workspace
        timeoutSec: 900
        graceSec: 15
        maxTurnsPerRun: 80
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  designer:
    role: designer
    icon: palette
    capabilities: 컷 카피 작성, 캔버스 기준 비주얼 시스템 정의, 카피-조판 정합성 확보, Higgsfield MCP 제품 이미지 보정·누끼·스튜디오 컷 생성
    budgetMonthlyCents: 0
    reportsTo: orchestrator
    adapter:
      type: claude_local
      config:
        cwd: /home/leehg/Documents/workspace/detail-page-workspace
        # 이미지 생성 잡은 비동기다. 제출 후 job_status 폴링까지 감안해 넉넉히 준다.
        timeoutSec: 2400
        graceSec: 15
        maxTurnsPerRun: 160
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  builder:
    role: engineer
    icon: code
    capabilities: 고정폭 캔버스 HTML 조판, Chromium 렌더·슬라이스 내보내기, 렌더 사고 진단
    budgetMonthlyCents: 0
    reportsTo: orchestrator
    adapter:
      type: claude_local
      config:
        cwd: /home/leehg/Documents/workspace/detail-page-workspace
        # 조판 + Chromium 렌더 + 슬라이스 캡처 + 업로드까지 한 런에서 끝낸다.
        timeoutSec: 2400
        graceSec: 20
        maxTurnsPerRun: 180
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  qa:
    role: qa
    icon: shield-check
    capabilities: 내보낸 이미지 육안 검수(후킹·콘텐츠·비주얼·렌더), 원인 단계 지목
    budgetMonthlyCents: 0
    reportsTo: orchestrator
    adapter:
      type: claude_local
      config:
        cwd: /home/leehg/Documents/workspace/detail-page-workspace
        timeoutSec: 1200
        graceSec: 15
        maxTurnsPerRun: 100
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

projects:
  detail-page:
    workspace:
      cwd: /home/leehg/Documents/workspace/detail-page-workspace
      isPrimary: true
