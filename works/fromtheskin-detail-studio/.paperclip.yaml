schema: paperclip/v1

# Paperclip 벤더 확장 — 이 파일이 없어도 패키지는 유효하다.
#
# 공통 메모
#   - adapter.config.model 은 자리 성격에 맞춰 고정한다.
#       opus   — 판단·창작·검수가 핵심인 자리
#                (director / compliance / evidence / copywriter / asset-producer)
#       sonnet — 확정된 스펙을 옮기는 자리 (compositor / publisher)
#     compliance 는 규제 위반의 마지막 방어선이라 opus 를 아끼지 않는다.
#     compositor 는 분량이 크지만 하는 일이 "확정된 카피를 HTML 로 옮기고 렌더"라 sonnet 으로 충분하다.
#
#   - cwd 는 이 머신 전용 경로다. 다른 머신으로 옮기면 반드시 바꾼다.
#     설계서·분석보고서·assets/ 가 전부 biomoa 저장소 안에 있어서 그쪽을 작업 디렉터리로 잡았다.
#
#   - heartbeat.enabled=false 는 의도적이다. 타이머로 계속 깨우지 않고
#     "배정될 때만" 깨어나는 이벤트 구동 방식을 쓴다. director 만 타이머를 돈다.
#
#   - HIGGSFIELD_API_KEY 는 asset-producer 만 필요하다. 값은 커밋하지 않는다.
#
#   - 현재 회사 모드는 PILOT (광고주 컨펌용) 이다. 모드는 런타임 설정이 아니라
#     skills/pilot-mode/SKILL.md + COMPANY.md 가 규정한다. 전 에이전트가 그 스킬을 가진다.
#     실증 미확보 수치를 빈칸으로 렌더하고 24블록 전부를 뽑는다. 대외 게시는 하지 않는다.
#     LIVE 전환은 placeholder_register 0건 + 협회 자문 회신 후 사람이 결정한다.

# brandColor 는 아이보리 — 페이지 톤앤매너와 동일.
# 주의: Paperclip 의 YAML 파서는 값 뒤 인라인 주석을 걷어내지 않는다. 주석은 항상 줄 단위로 쓴다.
company:
  brandColor: "#F2EFE9"
  requireBoardApprovalForNewAgents: false

agents:
  director:
    role: ceo
    icon: compass
    capabilities: 게이트 상태 판정, 블록 인벤토리 확정, 다운그레이드 결정, 단계 라우팅, 게시 승인
    adapter:
      type: claude_local
      config:
        model: claude-opus-5
        cwd: /home/leehg/Documents/workspace/biomoa
        timeoutSec: 900
        graceSec: 15
        maxTurnsPerRun: 120
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 300
        wakeOnDemand: true
        maxConcurrentRuns: 1

  compliance:
    role: qa
    icon: shield-check
    capabilities: 화장품법 광고 심의(S1~S8), 금지 조합 판정, 전체 인상 판정, 광고자문 접수 문서 작성
    reportsTo: director
    adapter:
      type: claude_local
      config:
        model: claude-opus-5
        # 렌더된 이미지·영상을 실제로 열어 보고 판정한다. 육안 검수라 넉넉히 준다.
        timeoutSec: 1500
        graceSec: 15
        maxTurnsPerRun: 100
        cwd: /home/leehg/Documents/workspace/biomoa
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  evidence:
    role: researcher
    icon: file-check
    capabilities: 실증자료 게이트(D1~D6) 관리, 시험성적서 대조, 3종 세트 검증, 다운그레이드 규칙 발동
    reportsTo: compliance
    adapter:
      type: claude_local
      config:
        model: claude-opus-5
        cwd: /home/leehg/Documents/workspace/biomoa
        timeoutSec: 900
        graceSec: 15
        maxTurnsPerRun: 80
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  copywriter:
    role: designer
    icon: pen-line
    capabilities: 24블록 카피 작성, FAQ 7문항, AI 고지문, 각주 문안, 허용 카피 사전 기반 자기 검열
    reportsTo: director
    adapter:
      type: claude_local
      config:
        model: claude-opus-5
        cwd: /home/leehg/Documents/workspace/biomoa
        timeoutSec: 1200
        graceSec: 15
        maxTurnsPerRun: 100
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  asset-producer:
    role: designer
    icon: camera
    capabilities: Higgsfield 판(plate) 생성(M/P/F), 실사 컷 조율, 매니페스트 관리, 톤앤매너 7항목 검수, P0 게이트 판정
    reportsTo: director
    adapter:
      type: claude_local
      config:
        model: claude-opus-5
        cwd: /home/leehg/Documents/workspace/biomoa
        # 생성 잡은 비동기다. 제출 후 job_status 폴링까지 감안해 넉넉히 준다.
        timeoutSec: 2400
        graceSec: 15
        maxTurnsPerRun: 160
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1
    inputs:
      env:
        HIGGSFIELD_API_KEY:
          kind: secret
          requirement: optional

  compositor:
    role: engineer
    icon: layers
    capabilities: HyperFrames 컴포지션 작성, 재사용 컴포넌트 7종, snapshot/render 출력, 분할 여백 밴드 확보
    reportsTo: director
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5
        cwd: /home/leehg/Documents/workspace/biomoa
        # 컴포지션 + lint + snapshot/render 를 한 런에서 끝낸다.
        timeoutSec: 2400
        graceSec: 20
        maxTurnsPerRun: 180
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

  publisher:
    role: engineer
    icon: code
    capabilities: 슬라이싱, 인코딩(ffmpeg), 용량 예산 검증, 마크업 생성, innerText 0 · alt 형식 검수
    reportsTo: compositor
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-5
        cwd: /home/leehg/Documents/workspace/biomoa
        timeoutSec: 1800
        graceSec: 20
        maxTurnsPerRun: 120
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 0
        wakeOnDemand: true
        maxConcurrentRuns: 1

projects:
  peeloff-detail-page:
    workspace:
      cwd: /home/leehg/Documents/workspace/biomoa
      isPrimary: true

routines:
  gate-status-review:
    triggers:
      - kind: schedule
        cronExpression: "0 10 * * 1"
        timezone: Asia/Seoul
